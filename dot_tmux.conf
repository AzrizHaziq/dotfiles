# Core terminal behavior
set -g default-terminal "tmux-256color"
set -as terminal-features ',tmux-256color:RGB'
set -as terminal-features ',xterm-256color:RGB'
set -g allow-passthrough on
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[5 q'
set -g mouse on
set -g history-limit 1000000
set -g detach-on-destroy off
set -g escape-time 0
set -g set-clipboard on
set -g focus-events on

# Use vi keys in copy mode.
# setw -g mode-keys vi, same as below
set-window-option -g mode-keys vi
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -selection clipboard'

# Start counting windows and panes from 1.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Theme: borders og
set -g pane-border-lines simple
set -g pane-border-style fg=black,bright
set -g pane-active-border-style fg=magenta

# Keep new panes and windows rooted in the current path.
bind c new-window -c '#{pane_current_path}'

# Keep window names stable so you can rename them yourself.
# set -g automatic-rename off
# set -g allow-rename off
set -wg automatic-rename on

# Rename the current window: Prefix + ,
bind , command-prompt -I '#W' 'rename-window -- "%%"'

# Prefix key: Ctrl-\\
unbind C-b
set -g prefix C-\\
bind C-\\ send-prefix

# Reload tmux config: Prefix + r
bind r source-file ~/.tmux.conf \; display-message 'tmux.conf reloaded'

# Split vertically: Prefix + |
bind | split-window -h -c '#{pane_current_path}'

# Split horizontally: Prefix + _
bind _ split-window -v -c '#{pane_current_path}'

# Kill pane: Prefix + x (skip prompt)
bind x kill-pane

# Move between tmux panes: Prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes: Prefix + H/J/K/L
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# ═══════════════════════════════════════════════════════════════════════════
# STATUS BAR CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════

set -g status-position top
set -g status-left-length 100
set -g status-right-length 100
set -g status-style "bg=#{@thm_bg}"

set -g status-left '#[fg=#{@thm_rosewater},bg=#{@thm_bg}]#[fg=#{@thm_bg},bg=#{@thm_rosewater},bold]💻 #S #[fg=#{@thm_rosewater},bg=#{@thm_bg}] '

set -g status-right '#[fg=#{?client_prefix,#{@thm_blue},#{?pane_in_mode,#{@thm_yellow},#{?pane_synchronized,#{@thm_red},#{@thm_green}}}},bg=#{@thm_bg}]'
set -ag status-right '#[fg=#{@thm_bg},bg=#{?client_prefix,#{@thm_blue},#{?pane_in_mode,#{@thm_yellow},#{?pane_synchronized,#{@thm_red},#{@thm_green}}}},bold]'
set -ag status-right '#{?client_prefix,WAIT,#{?pane_in_mode,COPY,#{?pane_synchronized,SYNC,TMUX}}}'
set -ag status-right '#[fg=#{?client_prefix,#{@thm_blue},#{?pane_in_mode,#{@thm_yellow},#{?pane_synchronized,#{@thm_red},#{@thm_green}}}},bg=#{@thm_bg}]'

set -ag status-right ' #{E:@catppuccin_status_application}' 
set -ag status-right '#[fg=#{@thm_surface_0},bg=#{@thm_bg}] '

set -ag status-right '#[fg=#{@thm_sapphire},bg=#{@thm_bg}]#[fg=#{@thm_bg},bg=#{@thm_sapphire},bold] #[fg=#{@thm_fg},bg=#{@thm_surface_0},nobold] #{s|^/home/azrizhaziq|~|:pane_current_path} #[fg=#{@thm_surface_0},bg=#{@thm_bg}]'

# ═══════════════════════════════════════════════════════════════════════════
# TPM PLUGINS
# ═══════════════════════════════════════════════════════════════════════════

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'aserowy/tmux.nvim'
set -g @plugin 'sainnhe/tmux-fzf'

# ═══════════════════════════════════════════════════════════════════════════
# THEME: CATPPUCCIN MOCHA
# ═══════════════════════════════════════════════════════════════════════════

# Catppuccin flavor and styling
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

# Colors for tmux chooser views (session list, etc.)
set -g mode-style 'fg=#cdd6f4,bg=#313244,bold'
set -g message-style 'fg=#cdd6f4,bg=#1e1e2e'
set -g message-command-style 'fg=#f9e2af,bg=#1e1e2e'

# Keep pane colors consistent across active and inactive panes
set -gu window-style
set -gu window-active-style

# ═══════════════════════════════════════════════════════════════════════════
# NVIM INTEGRATION: tmux.nvim + Smooth Pane Navigation
# ═══════════════════════════════════════════════════════════════════════════

# aserowy/tmux.nvim recommended keybindings
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|n?vim?x?)(-wrapped)?(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

set -g @tmux-nvim-navigation true
set -g @tmux-nvim-navigation-cycle true
set -g @tmux-nvim-navigation-keybinding-left 'C-h'
set -g @tmux-nvim-navigation-keybinding-down 'C-j'
set -g @tmux-nvim-navigation-keybinding-up 'C-k'
set -g @tmux-nvim-navigation-keybinding-right 'C-l'

# ═══════════════════════════════════════════════════════════════════════════
# SESSION MANAGEMENT: tmux-resurrect & tmux-continuum
# ═══════════════════════════════════════════════════════════════════════════

# tmux-resurrect: save/restore bindings (optional, default is Prefix + Ctrl-S/R)
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# tmux-continuum: enable auto-save/restore
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ═══════════════════════════════════════════════════════════════════════════
# SESH: Smart Session Manager
# ═══════════════════════════════════════════════════════════════════════════

# Session picker with fzf - Prefix + T
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

bind-key L run-shell "sesh last"

# # Jump to root session - Prefix + 9
# bind-key 9 run-shell "sesh connect --root $(echo 'asdasdasd')"

# toggle floating mode
bind f display-popup -w 80% -h 80% -d "#{pane_current_path}" -E

# toggle floating mode with lz
bind g display-popup -w 80% -h 80% -d "#{pane_current_path}" -E "lazygit"

run '~/.tmux/plugins/tpm/tpm'
