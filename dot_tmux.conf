# Core terminal behavior
set -g default-terminal "tmux-256color"
set -as terminal-features ',tmux-256color:RGB'
set -as terminal-features ',xterm-256color:RGB'
set -g allow-passthrough on
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[5 q'
set -g mouse on
set -g history-limit 100000
set -g escape-time 0
set -g focus-events on

# Use vi keys in copy mode.
setw -g mode-keys vi

# Start counting windows and panes from 1.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Theme: borders
set -g pane-border-lines simple
set -g pane-border-style fg=black,bright
set -g pane-active-border-style fg=magenta

# Keep new panes and windows rooted in the current path.
bind c new-window -c '#{pane_current_path}'

# Keep window names stable so you can rename them yourself.
set -g automatic-rename off
set -g allow-rename off

# Rename the current window: Prefix + ,
bind , command-prompt -I '#W' 'rename-window -- "%%"'

# Prefix key: Ctrl-\\
unbind C-b
set -g prefix C-\\
bind C-\\ send-prefix

# Reload tmux config: Prefix + r
bind r source-file ~/.tmux.conf \; display-message 'tmux.conf reloaded'

# Split vertically: Prefix + |
bind | split-window -h -c '#{pane_current_path}'

# Split horizontally: Prefix + -
bind - split-window -v -c '#{pane_current_path}'

# Move between tmux panes: Prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes: Prefix + H/J/K/L
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# toggle floating mode
bind f display-popup -w 80% -h 80% -d "#{pane_current_path}" -E

# toggle floating mode with lz
bind g display-popup -w 80% -h 80% -d "#{pane_current_path}" -E "lazygit"

# toggle floating mode with lz
bind N display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
bind t display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

# Put the tmux status line at the top.
set -g status-position top

# Catppuccin status line.
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ''
set -g status-right '#{E:@catppuccin_status_application}'
set -ag status-right '#{E:@catppuccin_status_session}'
set -ag status-right ' #[fg=#a6adc8]#T'
set -ag status-right ' #[fg=yellow,bold]#I.#P'

# TPM plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Disable the default Ctrl-\\ previous-pane mapping so it does not fight the prefix.
set -g @vim_navigator_mapping_prev ''
set -g @vim_navigator_prefix_mapping_clear_screen ''
set -g @vim_navigator_preserve_zoom '1'

# Catppuccin Mocha theme.
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

# Colors for tmux chooser views like the session list (Prefix + s).
set -g mode-style 'fg=#cdd6f4,bg=#313244,bold'
set -g message-style 'fg=#cdd6f4,bg=#1e1e2e'
set -g message-command-style 'fg=#f9e2af,bg=#1e1e2e'

# Keep pane colors consistent across active and inactive panes.
set -gu window-style
set -gu window-active-style

# tmux-resurrect: save/restore bindings (optional, default is Prefix + Ctrl-S/R)
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# tmux-continuum: enable auto-save/restore
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Keep TPM at the bottom.
run '~/.tmux/plugins/tpm/tpm'
