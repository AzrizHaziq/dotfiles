set -g @plugin_path '~/.dotfiles/.config/tmux/plugins/'

set -g default-terminal "tmux-256color"
set -s terminal-features 'tmux-256color:RGB'
set -as terminal-features ',xterm-256color:RGB'
set -g allow-passthrough on
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[5 q'
set -g mouse on
set -g history-limit 50000
set -g detach-on-destroy off
set -g escape-time 0
set -g set-clipboard on
set -g focus-events on

# Use vi keys in copy mode.
# setw -g mode-keys vi, same as below
set-window-option -g mode-keys vi
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vu 'y' send -X copy-selection-and-cancel

# Start counting windows and panes from 1.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Theme: borders og
set -g pane-border-lines simple
set -g pane-border-style fg=black,bright
set -g pane-active-border-style fg=magenta

# Keep window names stable so you can rename them yourself.
set -wg automatic-rename on

# Prefix key: Ctrl-\\
unbind C-b
set -g prefix C-\\
bind C-\\ send-prefix

# window
#   new      prefix+c
#   rename:  prefix+,
#   kill:    prefix+&

# pane
#   split-h: prefix+%
#   split-v: prefix+"
#   kill:    prefix+x

# session
#   rename:  prefix+$
#   kill:    prefix+x
#   prev:    prefix+(
#   next:    prefix+)
#   list:    prefix+s

bind c new-window -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'

# Reload tmux config: Prefix + r
bind r source-file $HOME/.config/tmux/tmux.conf \; display-message 'tmux.conf reloaded'  # default: none (custom)

# ═══════════════════════════════════════════════════════════════════════════
# TPM PLUGINS
# ═══════════════════════════════════════════════════════════════════════════

set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'aserowy/tmux.nvim'
set -g @plugin 'tmux-plugins/tpm'

# ═══════════════════════════════════════════════════════════════════════════
# THEME: CATPPUCCIN MOCHA
# ═══════════════════════════════════════════════════════════════════════════

# Catppuccin flavor and styling
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W#{?@workmux_status, #{@workmux_status},}'
set -g @catppuccin_window_current_text ' #W#{?@workmux_status, #{@workmux_status},}'

# Colors for tmux chooser views (session list, etc.)
set -g mode-style 'fg=#cdd6f4,bg=#313244,bold'
set -g message-style 'fg=#cdd6f4,bg=#1e1e2e'
set -g message-command-style 'fg=#f9e2af,bg=#1e1e2e'

# Keep pane colors consistent across active and inactive panes
set -gu window-style
set -gu window-active-style

# ═══════════════════════════════════════════════════════════════════════════
# STATUS BAR CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════

set -g status-position top
set -g status-left-length 100
set -g status-right-length 100
set -g status-style "bg=#{@thm_bg}"

set -g status-left '#[fg=#{?client_prefix,#{@thm_blue},#{?pane_in_mode,#{@thm_yellow},#{?pane_synchronized,#{@thm_red},#{@thm_green}}}},bg=#{@thm_bg}]#[fg=#{@thm_bg},bg=#{?client_prefix,#{@thm_blue},#{?pane_in_mode,#{@thm_yellow},#{?pane_synchronized,#{@thm_red},#{@thm_green}}}},bold] #{?client_prefix,😴,#{?pane_in_mode,✂️,#{?pane_synchronized,🔄,💻}}} #S #[fg=#{?client_prefix,#{@thm_blue},#{?pane_in_mode,#{@thm_yellow},#{?pane_synchronized,#{@thm_red},#{@thm_green}}}},bg=#{@thm_bg}] '

set -g status-right ' #{E:@catppuccin_status_application}' 
set -ag status-right '#[fg=#{@thm_surface_0},bg=#{@thm_bg}] '

set -ag status-right '#[fg=#{@thm_sapphire},bg=#{@thm_bg}]#[fg=#{@thm_bg},bg=#{@thm_sapphire},bold] #[fg=#{@thm_fg},bg=#{@thm_surface_0},nobold] #{s|^/home/azrizhaziq|~|:pane_current_path} #[fg=#{@thm_surface_0},bg=#{@thm_bg}]'

# ═══════════════════════════════════════════════════════════════════════════
# NVIM INTEGRATION: tmux.nvim + Smooth Pane Navigation
# ═══════════════════════════════════════════════════════════════════════════

# aserowy/tmux.nvim recommended keybindings
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|n?vim?x?)(-wrapped)?(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

set -g @tmux-nvim-navigation true
set -g @tmux-nvim-navigation-cycle true
set -g @tmux-nvim-navigation-keybinding-left 'C-h'
set -g @tmux-nvim-navigation-keybinding-down 'C-j'
set -g @tmux-nvim-navigation-keybinding-up 'C-k'
set -g @tmux-nvim-navigation-keybinding-right 'C-l'

# ═══════════════════════════════════════════════════════════════════════════
# SESSION MANAGEMENT
# ═══════════════════════════════════════════════════════════════════════════

bind-key s display-popup -h 90% -w 50% -E "sesh picker -i --preview"
bind l switch-client -l # go to last
bind g display-popup -w 80% -h 80% -d "#{pane_current_path}" -E "lazygit" 
bind W display-popup -w 80% -h 80% -E "workmux dashboard"

run '~/.config/tmux/plugins/tpm/tpm'
