name = "Chezmoi"
description = "Chezmoi dotfiles"
group = "Personal"
working_dir = "~/.local/share/chezmoi"

[[tabs]]
  name = "main"

[[tabs.panes]]
  label = "editor"
  command = "nvim ."

[[tabs.panes]]
  label = "diff"
  command = "chezmoi diff"
  split = "right"

[[tabs]]
  name = "terminal"

[[tabs]]
  name = "git"
  command = "lazygit"
