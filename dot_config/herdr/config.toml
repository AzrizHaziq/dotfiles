onboarding = false

[theme]
  name = "tokyo-night"

[ui.toast]
  delivery = "terminal"

[ui.sound]
  enabled = true

[ui]
  show_agent_labels_on_pane_borders = true

[keys]
  prefix = "ctrl+\\"

  switch_tab = "prefix+1..9"
  switch_workspace = "prefix+ctrl+1..9"
  focus_agent = "prefix+alt+1..9"

  # Session
  detach = "prefix+q"
  goto = "prefix+g"
  # settings = "prefix+e"

  # Workspaces
  workspace_picker = "prefix+w"
  new_workspace = "prefix+shift+n"
  rename_workspace = "prefix+shift+w"
  close_workspace = "prefix+shift+d"
  new_worktree = "prefix+shift+g"

  navigate_workspace_up = "p"
  navigate_workspace_down = "n"
  navigate_pane_left = "h"
  navigate_pane_down = "j"
  navigate_pane_up = "k"
  navigate_pane_right = "l"

  # Tabs
  new_tab = "prefix+c"
  previous_tab = "prefix+p"
  next_tab = "prefix+n"
  rename_tab = "prefix+shift+t"
  close_tab = "prefix+shift+x"

  # Pane swap
  swap_pane_left = "prefix+shift+h"
  swap_pane_down = "prefix+shift+j"
  swap_pane_up = "prefix+shift+k"
  swap_pane_right = "prefix+shift+l"

  # Pane cycle
  cycle_pane_next = "prefix+tab"
  cycle_pane_previous = "prefix+shift+tab"

  # Pane management
  split_vertical = "prefix+|"
  split_horizontal = "prefix+_"
  close_pane = "prefix+x"
  zoom = "prefix+z"
  resize_mode = "prefix+r"

  # UI
  toggle_sidebar = "prefix+b"
  copy_mode = "prefix+["

[[keys.command]]
  key = "prefix+s"
  type = "plugin_action"
  command = "cloudmanic.herdr-plus.projects"
  description = "herdr-plus: projects"

[[keys.command]]
  key = "prefix+a"
  type = "plugin_action"
  command = "cloudmanic.herdr-plus.quick-actions"
  description = "herdr-plus: quick actions"

[[keys.command]]
  key = "ctrl+h"
  type = "plugin_action"
  command = "herdr-splits.nav-left"

[[keys.command]]
  key = "ctrl+j"
  type = "plugin_action"
  command = "herdr-splits.nav-down"

[[keys.command]]
  key = "ctrl+k"
  type = "plugin_action"
  command = "herdr-splits.nav-up"

[[keys.command]]
  key = "ctrl+l"
  type = "plugin_action"
  command = "herdr-splits.nav-right"

[[keys.command]]
  key = "alt+h"
  type = "plugin_action"
  command = "herdr-splits.resize-left"

[[keys.command]]
  key = "alt+j"
  type = "plugin_action"
  command = "herdr-splits.resize-down"

[[keys.command]]
  key = "alt+k"
  type = "plugin_action"
  command = "herdr-splits.resize-up"

[[keys.command]]
  key = "alt+l"
  type = "plugin_action"
  command = "herdr-splits.resize-right"
