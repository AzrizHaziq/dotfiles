onboarding = false

[theme]
name = "dracula"

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true

[keys]
prefix = "ctrl+b"
new_workspace = "n"
rename_workspace = "N"
close_workspace = "D"
reload_config = "R"      # optional, unset by default
new_tab = "c"
split_vertical = "|"
split_horizontal = "_"
close_pane = "x"
fullscreen = "f"
resize_mode = "r"
toggle_sidebar = "b"
# previous_workspace = "ctrl+alt+["
# next_workspace = "ctrl+alt+]"
rename_tab = "C"
previous_tab = "T"
next_tab = "t"
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
