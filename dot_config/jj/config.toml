#:schema https://docs.jj-vcs.dev/latest/config-schema.json
[user]
  name = "azrizhaziq"

[ui]
  editor = "nvim"
  pager = ["hunk", "pager"]
  diff-formatter = ":git"
  merge-editor = "meld"

[format]
  timestamp-format = "%Y-%m-%d %H:%M:%S"

[aliases]
  l = ["log", "-r", "ancestors(@)", "--no-graph"]
  L = ["log", "--no-pager"]
  s = ["status"]
  d = ["diff"]

