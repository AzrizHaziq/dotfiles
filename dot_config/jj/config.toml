#:schema https://docs.jj-vcs.dev/latest/config-schema.json
[user]
  name = "azrizhaziq"

[ui]
  editor = "nvim"
  diff-formatter = ":git"
  merge-editor = "meld"

[format]
  timestamp-format = "%Y-%m-%d %H:%M:%S"

[aliases]
  l = ["log", "-r", "ancestors(@)", "--no-pager", "-n", "10"]
  L = ["log", "-r", "main@origin::@"]
  s = ["status"]
  no_working = ["diff", "--git", "-r", "x", "| hunk patch"]
  h = ["util", "exec", "--", "bash", "-c", """
      jj diff --git -r "${1:-@}" | hunk patch
    """, ""
  ]

