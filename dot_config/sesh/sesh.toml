#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

[tui]
  prompt = "> "
  placeholder = "Filter sessions... "
  show_icons = true
  show_windows = true

# ───────────────────────────────────────────────────────────────────────────
# Window Configurations
# ───────────────────────────────────────────────────────────────────────────

[[window]]
  name = "editor"
  startup_script = "nvim ."

[[window]]
  name = "git"
  startup_script = "lazygit"

[[window]]
  name = "jj"
  startup_script = "jj l"

# Server/logs window
[[window]]
  name = "server"
  startup_script = "echo 'Server logs...'"

# Database window
[[window]]
  name = "db"
  startup_script = "echo 'Database console'"

# Docker window with split (docker ps top, docker logs bottom)
[[window]]
  name = "docker"
  startup_script = "docker ps"

# Docker window with split (docker ps top, docker logs bottom)
[[window]]
  name = "opencode"
  startup_script = "opencode ."

[[window]]
  name = "cz diff"
  startup_script = "while true; clear; chezmoi diff; sleep 2; end"

# ───────────────────────────────────────────────────────────────────────────
# Session Configurations - Quick Access Configs
# ───────────────────────────────────────────────────────────────────────────

[[session]]
name = "config"
path = "~/.config"
startup_command = "nvim ."
preview_command = "eza --tree --level=1 --icons ~/.config"
icon = ""

[[session]]
name = "chezmoi"
path = "~/.local/share/chezmoi"
windows = ["cz diff", "editor", "jj", "opencode"]

# ───────────────────────────────────────────────────────────────────────────
# Wildcard Configurations
# ───────────────────────────────────────────────────────────────────────────

# Work projects get full dev setup
[[wildcard]]
pattern = "~/work/*"
startup_command = "nvim ."
windows = ["git", "server", "opencode"]

