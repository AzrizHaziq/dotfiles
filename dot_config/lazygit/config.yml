notARepository: "quit"
promptToReturnFromSubprocess: false
os:
  editPreset: nvim

git:
  pagers:
    - useExternalDiffGitConfig: true

gui:
  showPanelJumps: true
  border: rounded
  nerdFontsVersion: "3"
  skipDiscardChangeWarning: true
  theme:
    activeBorderColor:
      - "#89b4fa"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    cherryPickedCommitBgColor:
      - "#45475a"
    cherryPickedCommitFgColor:
      - "#f5e0dc"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
    searchingActiveBorderColor:
      - "#f9e2af"

customCommands:
  - key: w
    prompts:
      - type: input
        title: Commit summary
        initialValue: ""
    description: Commit changes without pre-commit hook
    command: git commit -n -m '{{index .PromptResponses 0}}'
    context: files

services:
  'github-window-wsl.com': 'github:github.com'
