---
notARepository: "quit"
promptToReturnFromSubprocess: false
os:
  editPreset: nvim
git:
  pagers:
    # - useExternalDiffGitConfig: true
    - colorArg: always
      pager: hunk pager --mode split --line-numbers
gui:
  showPanelJumps: true
  border: "thick"
  nerdFontsVersion: "3"
  skipDiscardChangeWarning: true
  theme:
    activeBorderColor:
      - "#89b4fa"
      - bold
    inactiveBorderColor:
      - "#555555"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    cherryPickedCommitBgColor:
      - "#45475a"
    cherryPickedCommitFgColor:
      - "#f5e0dc"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
    searchingActiveBorderColor:
      - "#f9e2af"

keybinding:
  universal:
    nextTab: l
    prevTab: h
    nextBlock-alt: <disabled>
    prevBlock-alt: <disabled>
    jumpToBlock:
      - ""
      - "1"
      - "2"
      - "3"
      - "4"
    focusMainView: 0

customCommands:
  - key: W
    context: "files"
    description: "AI commit: generate msg + auto-commit (caveman-commit)"
    command: "zsh -c 'source ~/.zshrc.d/functions.zsh && lazygit-ai-commit'"
    loadingText: "Generating AI commit..."
    output: terminal
  - key: F
    context: localBranches
    description: Push --no-verify
    command: git push --no-verify --force-with-lease
    loadingText: "Pushing (no verify)..."
    output: terminal
services:
  "github-window-wsl.com": "github:github.com"
