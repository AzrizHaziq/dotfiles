notARepository: "quit"
promptToReturnFromSubprocess: false
os:
  editPreset: nvim
git:
  pagers:
    # - useExternalDiffGitConfig: true
    - colorArg: always
      pager: hunk pager --mode split --line-numbers
gui:
  showPanelJumps: true
  border: 'thick'
  nerdFontsVersion: "3"
  skipDiscardChangeWarning: true
  theme:
    activeBorderColor:
      - "#89b4fa"
      - bold
    inactiveBorderColor:
      - "#555555"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    cherryPickedCommitBgColor:
      - "#45475a"
    cherryPickedCommitFgColor:
      - "#f5e0dc"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
    searchingActiveBorderColor:
      - "#f9e2af"
customCommands:
  - key: W
    context: "files"
    description: "AI commit: generate msg + auto-commit (caveman-commit)"
    command: "zsh -c 'source ~/.zshrc && lazygit-ai-commit'"
    loadingText: "Generating AI commit..."
    output: terminal
  - key: w
    prompts:
      - type: input
        title: Commit summary
        initialValue: ""
    description: Commit changes without pre-commit hook
    command: git commit -n -m '{{index .PromptResponses 0}}'
    context: files
services:
  'github-window-wsl.com': 'github:github.com'
