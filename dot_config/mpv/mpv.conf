# ⏩ SEEKING (Navigation)
RIGHT      seek  5
LEFT       seek -5
UP         add volume  2
DOWN       add volumn -2
WHEEL_UP   add volume  2
WHEEL_DOWN add volume -2
m          cycle mute
D          add speed  0.1
S          add speed -0.1
N set speed 1.0                       # Backspace resets speed to normal

j cycle sub                            # Cycle through available subtitles
k cycle sub-visibility                 # Toggle subtitles on/off
v cycle audio                          # Cycle through available audio tracks

# 🖥️ WINDOW MANAGEMENT
# f     cycle fullscreen                 # Toggle fullscreen
# ENTER cycle fullscreen                 # Toggle fullscreen with Enter key
q     quit-watch-later                 # Save position and exit mpv
